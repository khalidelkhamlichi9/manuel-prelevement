<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Test Elementor Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .elementor-section {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }
        .elementor-container {
            display: flex;
            margin-right: auto;
            margin-left: auto;
            position: relative;
            max-width: 1140px;
        }
        .elementor-column {
            position: relative;
            min-height: 1px;
            display: flex;
        }
        .elementor-widget-wrap {
            position: relative;
            width: 100%;
            flex-wrap: wrap;
            align-content: flex-start;
            display: flex;
            padding: 10px;
        }
        .elementor-element {
            width: 100%;
        }
        .elementor-widget-container {
            transition: background .3s, border .3s, border-radius .3s, box-shadow .3s;
        }
        .elementor-testimonial {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        img {
            max-width: 100%;
            height: auto;
        }
        h2, h3 {
            margin-top: 0;
            color: #1d2939;
        }
        p {
            color: #475467;
            line-height: 1.6;
        }
        .swiper-wrapper {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
        }
        .swiper-slide {
            min-width: 300px;
            flex: 0 0 auto;
        }
    </style>
</head>
<body>
